nmos:
  vto: 0.7 #Vsb = 0での閾値電圧(V)
  gamma: 0.45 # 基盤バイアス効果係数(V1/2)
  phi: 0.9 # 基盤酸化膜のポテンシャル(V)
  nsub: 9e14 # 基盤のキャリア濃度(cm-3)
  ld: 0.08e-6 # ソースドレインの拡散長(m)
  uo: 350 # 電子の移動度(cm2/Vs)
  lambda: 0.1 # チャネル長変調係数(V-1)
  tox: 9e-9 # ゲート酸化膜の厚さ(m)
  pb: 0.9 # 基盤のビルトインポテンシャル(V)
  cj: 0.56e-3 # ソースドレイン底面の接合容量(F/m2)
  cjsw: 0.35e-11 # ソースドレイン側面の接合容量(F/m)
  mj: 0.45 # ソースドレイン底面の接合容量の解析式の指数
  mjsw: 0.2 # ソースドレイン側面の接合容量の解析式の指数
  cgdo: 0.4e-9 # ゲートドレインのオーバーラップ容量(F/m2)
  js: 1e-8 # ソースドレインの単位面積あたりのリーク電流(A/m2)
  cox: 3.84e-3 #(F/m2)
  ucox: 1.34e-4 #(A/V2)

pmos:
  vto: -0.8
  gamma: 0.4
  phi: 0.8
  nsub: 5e14
  ld: 0.09e-6
  uo: 100
  lambda: 0.2
  tox: 9e-9
  pb: 0.9
  cj: 0.94e-3
  cjsw: 0.32e-11
  mj: 0.5
  mjsw: 0.3
  cgdo: 0.3e-9
  js: 0.5e-8
  cox: 3.84e-3 
  ucox: 0.384e-4
